<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI_PLAN — TASK-XXX: Phác thảo giao diện</title>
  <!-- Bootstrap 5 để khớp stack ASP.NET Core MVC + Bootstrap của dự án -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f4f6f9; }
    .mockup-banner {
      background: #0f172a;
      color: #e2e8f0;
      padding: 10px 18px;
      font-size: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .field-hint {
      font-family: Consolas, monospace;
      font-size: 0.75rem;
      color: #0d6efd;
    }
  </style>
</head>
<body>
  <!-- Thanh thông tin bản phác thảo (không copy thanh này vào .cshtml thật) -->
  <div class="mockup-banner">
    <div>
      <strong>🎨 UI_PLAN — TASK-XXX:</strong> Phác thảo giao diện mẫu (chốt bố cục &amp; <code>id</code>/<code>name</code> trước khi ghép vào Razor View)
    </div>
    <div>
      <!-- Khi AI tạo file mới ở UI_PLAN/<YYYY-MM-DD>_<TASK_ID>.html thì đổi thành href="../plans/<YYYY-MM-DD>_<TASK_ID>.html" -->
      <a class="btn btn-sm btn-outline-info" href="../../plans/_template/plan.html" target="_blank">📋 Mở PLAN tương ứng</a>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- PHẦN GIAO DIỆN MẪU BẮT ĐẦU TỪ ĐÂY (AI Coder bám đúng bố cục & id/name) -->
  <!-- ===================================================================== -->
  <div class="container-fluid py-4">
    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center bg-white">
        <h5 class="mb-0">Tiêu đề màn hình / chức năng</h5>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLamMoi">Làm mới</button>
          <button type="button" class="btn btn-primary btn-sm" id="btnLuu">Lưu thay đổi</button>
        </div>
      </div>

      <div class="card-body">
        <!-- Ví dụ bộ lọc / form nhập liệu với đúng id/name khớp DB -->
        <form id="frmChucNang" class="row g-3 mb-4">
          <div class="col-md-4">
            <label for="TuNgay" class="form-label">Từ ngày <span class="field-hint">#TuNgay</span></label>
            <input type="date" class="form-control form-control-sm" id="TuNgay" name="TuNgay" />
          </div>
          <div class="col-md-4">
            <label for="DenNgay" class="form-label">Đến ngày <span class="field-hint">#DenNgay</span></label>
            <input type="date" class="form-control form-control-sm" id="DenNgay" name="DenNgay" />
          </div>
          <div class="col-md-4">
            <label for="SoLanIn" class="form-label">Số lần in <span class="field-hint">#SoLanIn</span></label>
            <input type="number" class="form-control form-control-sm" id="SoLanIn" name="SoLanIn" min="0" value="0" />
          </div>
        </form>

        <!-- Ví dụ bảng dữ liệu -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th style="width: 50px;" class="text-center">#</th>
                <th>Mã hồ sơ</th>
                <th>Họ tên</th>
                <th class="text-center">Số lần in</th>
                <th class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="text-center">1</td>
                <td>HS-0001</td>
                <td>Nguyễn Văn A</td>
                <td class="text-center"><span class="badge bg-secondary">2</span></td>
                <td class="text-center">
                  <button type="button" class="btn btn-sm btn-outline-primary">Xem</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
